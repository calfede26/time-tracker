<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover: necessario per gestire le aree di sistema del telefono
      (barra di stato, navigazione/gesti) su Android via Capacitor.
      Gli env(safe-area-inset-*) si applicheranno all'intera app nelle schermate future.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Time Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
